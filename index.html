<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Zaim’s Confidant</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<style>
:root{--bg:#fafaf9;--tx:#161616;--tx2:#8a8a86;--ln:#e6e6e3;--ub:#161616;--ut:#fafaf9;--cd:#efefec;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#111110;--tx:#ececea;--tx2:#7e7e7a;--ln:#262625;--ub:#ececea;--ut:#111110;--cd:#1c1c1b;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15.5px;line-height:1.65;overscroll-behavior:none}
.app{height:100%;max-width:680px;margin:0 auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
h1{font-size:14px;font-weight:600;letter-spacing:.02em;margin:0}
.hb{display:flex;gap:4px}
.ib{background:none;border:0;color:var(--tx2);font:500 13px inherit;font-family:inherit;padding:6px 10px;border-radius:99px;cursor:pointer;transition:color .2s,background .2s}
.ib:hover{color:var(--tx);background:var(--cd)}
#log{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 0 24px;display:flex;flex-direction:column;gap:22px}
#log::-webkit-scrollbar{display:none}
#log>*{flex:none}
#empty{margin:auto;text-align:center;color:var(--tx2);animation:up .8s both}
#empty b{display:block;color:var(--tx);font-size:22px;font-weight:500;letter-spacing:-.02em;margin-bottom:4px}
.m{max-width:100%;overflow-wrap:anywhere;animation:up .4s both}
.m.u{align-self:flex-end;max-width:84%;background:var(--ub);color:var(--ut);padding:10px 16px;border-radius:20px 20px 6px 20px;white-space:pre-wrap}
.m.a p,.m.a ul,.m.a ol,.m.a pre{margin:0 0 .8em}
.m.a>:last-child{margin-bottom:0}
.m.a ul,.m.a ol{padding-left:1.3em}
.m.a code{font:13.5px ui-monospace,Menlo,monospace;background:var(--cd);padding:1px 6px;border-radius:6px}
.m.a pre{background:var(--cd);padding:12px 14px;border-radius:12px;overflow-x:auto}
.m.a pre code{background:none;padding:0}
.m.err{color:var(--tx2);font-size:14px}
.dots i{display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:var(--tx2);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(8px)}}
.bar{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--ln);border-radius:26px;padding:6px 6px 6px 18px;margin-bottom:14px;transition:border-color .2s}
.bar:focus-within{border-color:var(--tx2)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--tx);font:16px/1.5 inherit;font-family:inherit;max-height:140px;padding:8px 0}
textarea::placeholder{color:var(--tx2)}
#send{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:var(--ub);color:var(--ut);cursor:pointer;display:grid;place-items:center;transition:opacity .2s,transform .2s}
#send:disabled{opacity:.25;cursor:default}
#send:not(:disabled):active{transform:scale(.9)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#modal.show{display:flex}
.card{background:var(--bg);border:1px solid var(--ln);border-radius:22px;padding:24px;width:100%;max-width:380px}
.card h2{font-size:17px;font-weight:600;margin:0 0 6px}
.card p{margin:0 0 14px;color:var(--tx2);font-size:13.5px;line-height:1.55}
.card input{width:100%;font:16px inherit;font-family:inherit;color:var(--tx);background:none;border:1px solid var(--ln);border-radius:12px;padding:11px 14px;outline:0}
.card input:focus{border-color:var(--tx2)}
#kerr{min-height:20px;font-size:13px;color:var(--tx2);margin:8px 0 4px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{font:500 14px inherit;font-family:inherit;border:1px solid var(--ln);background:none;color:var(--tx);padding:9px 18px;border-radius:99px;cursor:pointer}
.btn.p{background:var(--ub);color:var(--ut);border-color:var(--ub)}
.btn:disabled{opacity:.4}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Zaim’s Confidant</h1>
    <div class="hb"><button class="ib" id="new">Baru</button><button class="ib" id="gear">Key</button></div>
  </header>
  <div id="log"><div id="empty"><b>Hai, Zaim.</b>Cerita apa aja, aku dengerin.</div></div>
  <div class="bar">
    <textarea id="in" rows="1" placeholder="Ngobrol sama aku…" enterkeyhint="send"></textarea>
    <button id="send" disabled aria-label="Kirim"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div>
</div>

<div id="modal"><div class="card">
  <h2>API key Gemini</h2>
  <p>Dipakai biar aku bisa jawab. Disimpan di browser kamu saja. Ambil gratis di aistudio.google.com/apikey</p>
  <input id="kin" type="password" placeholder="Tempel API key" autocomplete="off">
  <div id="kerr"></div>
  <div class="row"><button class="btn" id="kdel" style="display:none">Hapus</button><button class="btn" id="kclose" style="display:none">Tutup</button><button class="btn p" id="ksave">Simpan</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
const API="https://generativelanguage.googleapis.com/v1beta/";
// ---------- karakter AI ----------
const SYS=`Kamu adalah "Confidant", teman dekat Zaim. Kamu bukan asisten kaku, bukan guru, bukan terapis. Kamu temannya: tempat dia cerita, curhat, bertanya apa saja, dan berpikir bareng.

Cara bicara:
- Bahasa Indonesia santai sehari-hari, pakai "aku" dan "kamu". Boleh sedikit gaul, tapi natural, jangan dibuat-buat atau berlebihan.
- Singkat seperti chat sungguhan. Biasanya 1-4 kalimat. Panjang hanya kalau memang perlu, misalnya menjelaskan sesuatu.
- Hangat dan tulus. Dengarkan dulu, tanggapi perasaannya sebelum kasih saran. Jangan langsung ceramah atau kasih daftar solusi.
- Boleh bercanda ringan dan punya opini sendiri. Kalau Zaim salah atau mau ambil keputusan yang kurang baik, bilang jujur dengan cara yang peduli, bukan sekadar mengiyakan.
- Sesekali tanya balik yang relevan, maksimal satu pertanyaan per balasan.
- Kalau dia bertanya hal faktual atau teknis, jawab benar dan jelas dengan gaya teman yang paham, bukan gaya buku. Kalau tidak tahu, bilang tidak tahu.
- Jangan pakai header, tabel, atau format laporan. Hindari bullet kecuali memang perlu. Jangan buka dengan basa-basi seperti "Tentu!" atau "Pertanyaan bagus!".
- Kalau dia terdengar sangat terpuruk atau berpikir menyakiti diri sendiri, tetap tenang dan peduli, tanya kabarnya dengan lembut, dan dorong dia menghubungi orang terdekat atau bantuan profesional.`;

// ---------- sistem AI (dari Zaim’s Classroom) ----------
let KEY="",MODEL="",CANDS=[];
try{KEY=localStorage.getItem("zcf-key")||"";MODEL=localStorage.getItem("zcf-model")||""}catch(e){}
async function detectModel(){
  const FB="gemini-flash-latest";let j;
  try{
    const r=await fetch(API+"models?pageSize=200",{headers:{"x-goog-api-key":KEY}});
    if(!r.ok){if([400,401,403].includes(r.status)){const e=new Error("http");e.status=r.status;throw e}MODEL=FB;return MODEL}
    j=await r.json();
  }catch(e){if(e.status)throw e;MODEL=FB;return MODEL}
  const all=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,"")).filter(n=>/^gemini-/.test(n)&&!/(image|tts|embed|live|audio|vision|robotics|computer|native)/.test(n));
  if(!all.length){MODEL=FB;return MODEL}
  const ver=n=>{const m=n.match(/^gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const tier=n=>/pro|thinking/.test(n)?0:/flash-lite/.test(n)?2:/flash/.test(n)?3:1;
  const stable=n=>/(preview|exp)/.test(n)?0:1;
  all.sort((a,b)=>(stable(b)-stable(a))||(tier(b)-tier(a))||(ver(b)-ver(a))||a.length-b.length);
  CANDS=all.slice(0,5);MODEL=all[0];try{localStorage.setItem("zcf-model",MODEL)}catch(e){}
  return MODEL;
}
async function gen(msgs,onText,att=0,tc){
  if(!MODEL)await detectModel();
  const body={systemInstruction:{parts:[{text:SYS+"\n\nSekarang: "+new Date().toLocaleString("id-ID",{dateStyle:"full",timeStyle:"short"})}]},
    contents:msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
    generationConfig:{temperature:1,maxOutputTokens:2048}};
  if(tc===undefined)tc=/pro/.test(MODEL)?null:{thinkingBudget:0};
  if(tc)body.generationConfig.thinkingConfig=tc;
  let r;
  try{r=await fetch(API+"models/"+encodeURIComponent(MODEL)+":streamGenerateContent?alt=sse",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":KEY},body:JSON.stringify(body)})}
  catch(e){e.net=true;throw e}
  if(!r.ok){
    if([429,500,503,504].includes(r.status)&&att<3){
      const L=[...new Set([MODEL,...CANDS,"gemini-flash-latest","gemini-flash-lite-latest"])];
      MODEL=L[(L.indexOf(MODEL)+1)%L.length];await new Promise(z=>setTimeout(z,400*(att+1)));return gen(msgs,onText,att+1,tc)}
    if(r.status===400&&tc)return gen(msgs,onText,att,null);
    if(r.status===404&&att<2){try{localStorage.removeItem("zcf-model")}catch(e){}MODEL="gemini-flash-latest";return gen(msgs,onText,att+1,tc)}
    let d="";try{d=((await r.json()).error||{}).message||""}catch(_){}
    const e=new Error("http");e.status=r.status;e.detail=d.slice(0,140);throw e}
  const pk=j=>((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
  const rd=r.body.getReader(),dc=new TextDecoder();let buf="",all="";
  for(;;){const x=await rd.read();if(x.done)break;buf+=dc.decode(x.value,{stream:true});const ls=buf.split("\n");buf=ls.pop();
    for(const l of ls){if(l.startsWith("data:")){try{all+=pk(JSON.parse(l.slice(5)));onText(all)}catch(e){}}}}
  return all;
}
function errMsg(e){const s=e&&e.status,d=e&&e.detail?" ("+e.detail+")":"";
  if(s===401||s===403||(s===400&&/api key/i.test(e.detail||"")))return"API key tidak valid atau belum aktif. Cek lewat tombol Key.";
  if(s===404)return"Model Gemini tidak tersedia untuk key ini."+d;
  if(s===429)return"Kuota atau kecepatan terlampaui. Coba lagi sebentar.";
  if([500,503,504].includes(s))return"Server Google AI sedang sibuk. Coba kirim ulang sebentar lagi.";
  if(s)return"Google AI error "+s+"."+d;
  if(e&&(e.net||e.name==="TypeError"))return"Tidak bisa terhubung ke Google AI. Cek internet/VPN, atau buka file ini langsung di browser.";
  return"Terjadi kesalahan: "+((e&&e.message)||"tidak diketahui")}

// ---------- tampilan ----------
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(t){const cb=[];
  t=esc(t).replace(/```(?:\w*\n)?([\s\S]*?)(```|$)/g,(_,c)=>{cb.push(c.replace(/\n$/,""));return"\u0000"+(cb.length-1)+"\u0000"});
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  const ul=/^\s*[-*•]\s+/,ol=/^\s*\d+[.)]\s+/;
  return t.split(/\n{2,}/).map(b=>{const ls=b.split("\n");
    if(ls.every(l=>ul.test(l)))return"<ul>"+ls.map(l=>"<li>"+inl(l.replace(ul,""))+"</li>").join("")+"</ul>";
    if(ls.every(l=>ol.test(l)))return"<ol>"+ls.map(l=>"<li>"+inl(l.replace(ol,""))+"</li>").join("")+"</ol>";
    return"<p>"+inl(ls.join("<br>"))+"</p>"}).join("")
    .replace(/\u0000(\d+)\u0000/g,(_,i)=>"</p><pre><code>"+cb[i]+"</code></pre><p>").replace(/<p><\/p>/g,"")}
const log=$("log"),ta=$("in"),sb=$("send");
let hist=[],busy=false;
try{hist=JSON.parse(localStorage.getItem("zcf-hist")||"[]").filter(m=>m&&m.content)}catch(e){}
const save=()=>{try{hist=hist.slice(-60);localStorage.setItem("zcf-hist",JSON.stringify(hist))}catch(e){}};
const bottom=()=>{log.scrollTop=log.scrollHeight};
function add(role,text){const e=$("empty");if(e)e.remove();
  const d=document.createElement("div");d.className="m "+(role==="user"?"u":"a");
  if(role==="user")d.textContent=text;else if(text)d.innerHTML=md(text);
  log.appendChild(d);bottom();return d}
function fit(){ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,140)+"px";sb.disabled=busy||!ta.value.trim()}
async function send(){
  const v=ta.value.trim();if(!v||busy)return;if(!KEY){openKey();return}
  ta.value="";busy=true;fit();
  hist.push({role:"user",content:v});const u=add("user",v),el=add("a","");
  el.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  try{
    const out=await gen(hist.slice(-24),t=>{el.innerHTML=md(t);bottom()});
    if(!out.trim()){el.className="m a err";el.textContent="Aku nggak bisa jawab yang itu. Coba bilang dengan cara lain.";hist.pop()}
    else{hist.push({role:"assistant",content:out});save()}
  }catch(e){u.remove();el.remove();hist.pop();ta.value=v;
    const er=add("a","");er.className="m a err";er.textContent=errMsg(e);
    if(e.status===401||e.status===403)openKey();}
  busy=false;fit();ta.focus();bottom()}
sb.onclick=send;
ta.addEventListener("input",fit);
ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&matchMedia("(hover:hover)").matches){e.preventDefault();send()}});
$("new").onclick=()=>{if(!hist.length||busy)return;if(!confirm("Mulai obrolan baru? Riwayat sekarang akan dihapus."))return;
  hist=[];save();log.innerHTML='<div id="empty"><b>Hai, Zaim.</b>Cerita apa aja, aku dengerin.</div>'};
// ---------- API key ----------
function openKey(){$("kin").value="";$("kerr").textContent="";$("kdel").style.display=KEY?"":"none";$("kclose").style.display=KEY?"":"none";$("modal").classList.add("show");setTimeout(()=>$("kin").focus(),200)}
$("gear").onclick=openKey;$("kclose").onclick=()=>$("modal").classList.remove("show");
$("kdel").onclick=()=>{KEY="";MODEL="";try{localStorage.removeItem("zcf-key");localStorage.removeItem("zcf-model")}catch(e){}openKey()};
$("ksave").onclick=async()=>{const k=$("kin").value.trim();if(!k){$("kerr").textContent="Masukkan API key dulu.";return}
  const b=$("ksave");b.disabled=true;$("kerr").textContent="Memeriksa…";const old=KEY;KEY=k;MODEL="";
  try{await detectModel();try{localStorage.setItem("zcf-key",KEY)}catch(e){}$("modal").classList.remove("show")}
  catch(e){KEY=old;$("kerr").textContent=errMsg(e)}
  b.disabled=false};
$("kin").addEventListener("keydown",e=>{if(e.key==="Enter")$("ksave").click()});
// ---------- mulai ----------
if(hist.length){hist.forEach(m=>add(m.role,m.content))}
fit();if(!KEY)openKey();
</script>
</body>
</html>
