<style>
:root{--bg:#fafaf9;--tx:#161616;--tx2:#8a8a86;--ln:#e6e6e3;--ub:#161616;--ut:#fafaf9;--cd:#efefec;color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15.5px;line-height:1.65;overscroll-behavior:none}

<script>
const $=id=>document.getElementById(id);
const API="https://generativelanguage.googleapis.com/v1beta/";
// ---------- karakter AI ----------
const SYS=`Kamu adalah "Confidant", teman dekat Zaim. Kamu bukan asisten kaku, bukan guru, bukan terapis. Kamu temannya: tempat dia cerita, curhat, bertanya apa saja, dan berpikir bareng.

Cara bicara:
- Bahasa Indonesia santai sehari-hari, pakai "aku" dan "kamu". Boleh sedikit gaul, tapi natural, jangan dibuat-buat atau berlebihan.
- Singkat seperti chat sungguhan. Biasanya 1-4 kalimat. Panjang hanya kalau memang perlu, misalnya menjelaskan sesuatu.
- Hangat dan tulus. Dengarkan dulu, tanggapi perasaannya sebelum kasih saran. Jangan langsung ceramah atau kasih daftar solusi.
- Boleh bercanda ringan dan punya opini sendiri. Kalau Zaim salah atau mau ambil keputusan yang kurang baik, bilang jujur dengan cara yang peduli, bukan sekadar mengiyakan.
- Sesekali tanya balik yang relevan, maksimal satu pertanyaan per balasan.
- Kalau dia bertanya hal faktual atau teknis, jawab benar dan jelas dengan gaya teman yang paham, bukan gaya buku. Kalau tidak tahu, bilang tidak tahu.
- Jangan pakai header, tabel, atau format laporan. Hindari bullet kecuali memang perlu. Jangan buka dengan basa-basi seperti "Tentu!" atau "Pertanyaan bagus!".
- Kalau dia terdengar sangat terpuruk atau berpikir menyakiti diri sendiri, tetap tenang dan peduli, tanya kabarnya dengan lembut, dan dorong dia menghubungi orang terdekat atau bantuan profesional.`;

// ---------- akun (Supabase Auth) ----------
const SBU="https://ypdtaoccfxzquyfsiloy.supabase.co",SBK="sb_publishable_2crOjnp8Rf4zhCt2bdO_Ug_rH4enKGH";
let SES=null;try{SES=JSON.parse(localStorage.getItem("zcf-ses")||"null")}catch(e){}
const HK=()=>"zcf-hist"+(SES?"-"+SES.user.id:"");
async function authCall(path,body){
  const r=await fetch(SBU+"/auth/v1/"+path,{method:"POST",headers:{apikey:SBK,"Content-Type":"application/json"},body:JSON.stringify(body)});
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(d.error_description||d.msg||d.message||"auth "+r.status);e.status=r.status;e.code=d.error_code||"";throw e}return d}
function setSes(d){if(!d||!d.access_token)return false;
  SES={access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at||Math.floor(Date.now()/1000)+(d.expires_in||3600),user:{id:d.user.id,email:d.user.email}};
  try{localStorage.setItem("zcf-ses",JSON.stringify(SES))}catch(e){}return true}
let _rf=null;
async function tok(){if(!SES||SES.expires_at*1000>Date.now()+60000)return;
  if(!_rf)_rf=authCall("token?grant_type=refresh_token",{refresh_token:SES.refresh_token}).then(setSes).catch(e=>{if(e.status===400||e.status===401){SES=null;try{localStorage.removeItem("zcf-ses")}catch(x){}}}).finally(()=>{_rf=null});
  await _rf}
// database hanya disentuh kalau sudah login
async function sbx(path,m,b,pref){await tok();if(!SES)throw new Error("belum login");
  const h={apikey:SBK,Authorization:"Bearer "+SES.access_token,"Content-Type":"application/json"};if(pref)h.Prefer=pref;
  const r=await fetch(SBU+"/rest/v1/"+path,{method:m||"GET",headers:h,body:b!==undefined?JSON.stringify(b):undefined});
  if(!r.ok){let m="";try{m=(await r.json()).message||""}catch(e){}const er=new Error(m||"db "+r.status);er.status=r.status;throw er}const t=await r.text();return t?JSON.parse(t):null}
let DCTX="",DT=0;
const rows=async p=>(await sbx(p))||[];
async function dataCtx(force){if(!SES||(!force&&DT&&Date.now()-DT<3e5))return;DT=Date.now();
  const uid=SES.user.id,td=new Date(),iso=td.getFullYear()+"-"+String(td.getMonth()+1).padStart(2,"0")+"-"+String(td.getDate()).padStart(2,"0"),di=(td.getDay()+6)%7;
  const R=await Promise.allSettled([rows("manager_state?select=data&user_id=eq."+uid),rows("secretary_todos?select=text&done=eq.false&order=ts.desc&limit=10"),
    rows("secretary_notes?select=title&order=ts.desc&limit=8"),rows("class_sessions?select=title,scheduled_at&status=eq.scheduled&scheduled_at=gt."+encodeURIComponent(td.toISOString())+"&order=scheduled_at.asc&limit=4&user_id=eq."+uid)]);
  const N=["Manager","To do","Catatan","Kelas"],L=[],S=[],v=i=>R[i].status==="fulfilled"?R[i].value:[];
  R.forEach((r,i)=>S.push(N[i]+(r.status==="fulfilled"?" ✓":" ✗ "+(r.reason&&(r.reason.status||r.reason.message)||""))));
  const d=(v(0)[0]||{}).data||{},num=x=>Number(x)||0;
  (d.tasks||[]).filter(t=>!t.done).slice(0,8).forEach(t=>L.push("Tugas: "+t.title+(t.deadline?" (deadline "+t.deadline+")":"")));
  ((d.sched||[])[di]||[]).filter(x=>!x.date||x.date===iso).slice(0,8).forEach(x=>L.push("Hari ini: "+x.text+(x.time?" jam "+x.time:"")));
  if((d.tx||[]).length){const sm=k=>d.tx.filter(x=>x.type===k).reduce((a,x)=>a+num(x.amt),0);L.push("Saldo utama: Rp"+(sm("in")-sm("out")).toLocaleString("id-ID"))}
  (d.savings||[]).slice(0,5).forEach(g=>L.push("Tabungan "+g.name+": Rp"+num(g.saved).toLocaleString("id-ID")+(num(g.target)?" dari Rp"+num(g.target).toLocaleString("id-ID"):"")));
  v(1).forEach(t=>L.push("To do: "+t.text));v(2).forEach(t=>t.title&&L.push("Catatan: "+t.title));
  v(3).forEach(t=>L.push("Kelas: "+t.title+" "+new Date(t.scheduled_at).toLocaleString("id-ID",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})));
  DCTX=L.join("\n").slice(0,1800);
  if(R.some(r=>r.status!=="fulfilled"))DT=0;
  const el=$("ds");if(el){el.textContent="Data: "+S.join(" · ");el.style.display=""}}

// ---------- sistem AI (dari Zaim’s Classroom) ----------
let KEY="",MODEL="",CANDS=[];
try{KEY=localStorage.getItem("zcf-key")||"";MODEL=localStorage.getItem("zcf-model")||"";CANDS=JSON.parse(localStorage.getItem("zcf-cands")||"[]")}catch(e){}
const COOL={},TKM={},slp=ms=>new Promise(z=>setTimeout(z,ms));
async function detectModel(){
  const FB="gemini-flash-latest";let j;
  try{
    const r=await fetch(API+"models?pageSize=200",{headers:{"x-goog-api-key":KEY}});
    if(!r.ok){if([400,401,403].includes(r.status)){const e=new Error("http");e.status=r.status;throw e}MODEL=FB;return MODEL}
    j=await r.json();
  }catch(e){if(e.status)throw e;MODEL=FB;return MODEL}
  const all=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,"")).filter(n=>/^gemini-/.test(n)&&!/(image|tts|embed|live|audio|vision|robotics|computer|native)/.test(n));
  if(!all.length){MODEL=FB;return MODEL}
  const ver=n=>{const m=n.match(/^gemini-(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
  const tier=n=>/pro|thinking/.test(n)?0:/flash-lite/.test(n)?2:/flash/.test(n)?3:1;
  const stable=n=>/(preview|exp)/.test(n)?0:1;
  all.sort((a,b)=>(stable(b)-stable(a))||(tier(b)-tier(a))||(ver(b)-ver(a))||a.length-b.length);
  CANDS=all.slice(0,6);const l=all.find(n=>/lite/.test(n));if(l&&!CANDS.includes(l))CANDS.push(l);
  MODEL=all[0];try{localStorage.setItem("zcf-model",MODEL);localStorage.setItem("zcf-cands",JSON.stringify(CANDS))}catch(e){}
  return MODEL;
}
function thkOpts(m){if(/latest/.test(m))return[{thinkingBudget:0},{thinkingLevel:"minimal"},{thinkingLevel:"low"}];if(/gemini-2\.5/.test(m))return/pro/.test(m)?[{thinkingBudget:128}]:[{thinkingBudget:0}];if(/gemini-([3-9])/.test(m))return[{thinkingLevel:"minimal"},{thinkingLevel:"low"}];return[]}
const pool=()=>[...new Set([MODEL,...CANDS,"gemini-flash-latest","gemini-flash-lite-latest"].filter(Boolean))];
// satu permintaan ke satu model; error yang bisa dicoba ulang diberi e.retry
async function once(m,msgs,o,st){
  let tl=TKM[m]||0;
  for(;;){
    const body={systemInstruction:{parts:[{text:o.sys}]},contents:msgs.map(x=>({role:x.role==="assistant"?"model":"user",parts:[{text:x.content}]})),generationConfig:{temperature:1,maxOutputTokens:1024}};
    const tk=thkOpts(m)[tl];if(tk)body.generationConfig.thinkingConfig=tk;
    const ac=new AbortController();let to=false;const tmo=setTimeout(()=>{to=true;ac.abort()},20000);
    if(o.sig)o.sig.addEventListener("abort",()=>ac.abort(),{once:true});
    let r;st("Mengirim…");
    try{r=await fetch(API+"models/"+encodeURIComponent(m)+":streamGenerateContent?alt=sse",{method:"POST",signal:ac.signal,headers:{"Content-Type":"application/json","x-goog-api-key":KEY},body:JSON.stringify(body)});clearTimeout(tmo)}
    catch(err){clearTimeout(tmo);
      if(o.sig&&o.sig.aborted){err.userStop=true;throw err}
      if(to){COOL[m]=Date.now()+60000;err.retry=true;throw err}
      err.net=true;err.retry=(o.nr=(o.nr||0)+1)<2;await slp(700);throw err}
    if(!r.ok){
      let d="",j=null;try{j=await r.json();d=(j.error||{}).message||""}catch(_){}
      if(r.status===400&&tk){tl++;TKM[m]=tl;continue}
      const e=new Error("http");e.status=r.status;e.detail=d.slice(0,140);
      if(r.status===429){const w=/retry in ([\d.]+)s/i.exec(d),day=/PerDay|per day/i.test(JSON.stringify(j||{}));
        e.wait=day?36e5:Math.max(5000,w?parseFloat(w[1])*1000:20000);COOL[m]=Date.now()+e.wait;e.retry=true;throw e}
      if([500,503,504].includes(r.status)){COOL[m]=Date.now()+15000;e.retry=true;throw e}
      if(r.status===404){COOL[m]=Date.now()+36e5;e.retry=true;throw e}
      throw e}
    TKM[m]=tl;st("Menulis…");
    const pk=j=>((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||"").join("");
    const rd=r.body.getReader(),dc=new TextDecoder();let buf="",all="";
    for(;;){const x=await rd.read();if(x.done)break;buf+=dc.decode(x.value,{stream:true});const ls=buf.split("\n");buf=ls.pop();
      for(const l of ls){if(l.startsWith("data:")){try{all+=pk(JSON.parse(l.slice(5)));o.onText&&o.onText(all)}catch(e){}}}}
    return all}
}
// model yang kena limit dilewati dulu (cooldown), jadi balasan berikutnya tidak menunggu model yang penuh
async function gen(msgs,o={}){
  if(!MODEL)await detectModel();
  const st=o.onStatus||(()=>{});let last;
  for(let a=0;a<7;a++){
    if(o.sig&&o.sig.aborted){const e=new Error("stop");e.userStop=true;throw e}
    const L=pool(),n=Date.now();let m=L.find(x=>!(COOL[x]>n));
    if(!m){const w=Math.min(...L.map(x=>COOL[x]||0))-n;
      if(w>12000)throw last||Object.assign(new Error("http"),{status:429,wait:w});
      st("Menunggu kuota "+Math.ceil(w/1000)+" dtk…");await slp(w+300);m=L.find(x=>!(COOL[x]>Date.now()))||L[0]}
    try{return await once(m,msgs,o,st)}catch(e){if(e.userStop||!e.retry)throw e;last=e;if(a>0)st("Ganti model…")}
  }
  throw last}
function errMsg(e){const s=e&&e.status,d=e&&e.detail?" ("+e.detail+")":"";
  if(s===401||s===403||(s===400&&/api key/i.test(e.detail||"")))return"API key tidak valid atau belum aktif. Cek lewat tombol Key.";
  if(s===404)return"Model Gemini tidak tersedia untuk key ini."+d;
  if(s===429){const w=(e.wait||0);return w>6e5?"Kuota harian key ini habis. Coba besok atau ganti key lewat tombol Key.":"Kuota sedang penuh. Coba lagi ±"+Math.max(5,Math.ceil(w/1000))+" detik."}
  if([500,503,504].includes(s))return"Server Google AI sedang sibuk. Coba kirim ulang sebentar lagi.";
  if(s)return"Google AI error "+s+"."+d;
  if(e&&(e.net||e.name==="TypeError"))return"Tidak bisa terhubung ke Google AI. Cek internet/VPN, atau buka file ini langsung di browser.";
  return"Terjadi kesalahan: "+((e&&e.message)||"tidak diketahui")}

// ---------- tampilan ----------
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function md(t){const cb=[];
  t=esc(t).replace(/```(?:\w*\n)?([\s\S]*?)(```|$)/g,(_,c)=>{cb.push(c.replace(/\n$/,""));return"\u0000"+(cb.length-1)+"\u0000"});
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[\s(])\*([^*\n]+)\*/g,"$1<i>$2</i>");
  const ul=/^\s*[-*•]\s+/,ol=/^\s*\d+[.)]\s+/;
  return t.split(/\n{2,}/).map(b=>{const ls=b.split("\n");
    if(ls.every(l=>ul.test(l)))return"<ul>"+ls.map(l=>"<li>"+inl(l.replace(ul,""))+"</li>").join("")+"</ul>";
    if(ls.every(l=>ol.test(l)))return"<ol>"+ls.map(l=>"<li>"+inl(l.replace(ol,""))+"</li>").join("")+"</ol>";
    return"<p>"+inl(ls.join("<br>"))+"</p>"}).join("")
    .replace(/\u0000(\d+)\u0000/g,(_,i)=>"</p><pre><code>"+cb[i]+"</code></pre><p>").replace(/<p><\/p>/g,"")}
const log=$("log"),ta=$("in"),sb=$("send");
let hist=[],busy=false,AC=null;
try{hist=JSON.parse(localStorage.getItem(HK())||"[]").filter(m=>m&&m.content)}catch(e){}
const save=()=>{try{hist=hist.slice(-60);localStorage.setItem(HK(),JSON.stringify(hist))}catch(e){}};
const bottom=()=>{log.scrollTop=log.scrollHeight};
function add(role,text){const e=$("empty");if(e)e.remove();
  const d=document.createElement("div");d.className="m "+(role==="user"?"u":"a");
  if(role==="user")d.textContent=text;else if(text)d.innerHTML=md(text);
  log.appendChild(d);bottom();return d}
function fit(){ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,140)+"px";sb.disabled=!busy&&!ta.value.trim();sb.style.opacity=busy?".9":""}
async function send(){
  if(busy){AC&&AC.abort();return}
  const v=ta.value.trim();if(!v)return;if(!KEY){openKey();return}
  ta.value="";busy=true;fit();
  hist.push({role:"user",content:v});const u=add("user",v),el=add("a","");
  let part="";
  const stx=t=>{if(!part)el.innerHTML='<span class="dots"><i></i><i></i><i></i></span><small class="st">'+esc(t)+'</small>'};
  stx("");AC=new AbortController();await Promise.race([dataCtx(),slp(2500)]);
  const sys=SYS+"\n\nSekarang: "+new Date().toLocaleString("id-ID",{dateStyle:"full",timeStyle:"short"})+
    (DCTX?"\n\nKonteks hidup Zaim (dari app Manager, Secretary, Classroom miliknya; hanya untuk kamu tahu). Sebut hanya kalau nyambung dengan obrolan. Kamu cuma teman ngobrol: tidak bisa menambah, mengubah, atau menghapus data apa pun.\n"+DCTX:"");
  try{
    const out=await gen(hist.slice(-16),{sys,sig:AC.signal,onStatus:stx,onText:t=>{part=t;el.innerHTML=md(t);bottom()}});
    if(!out.trim()){el.className="m a err";el.textContent="Aku nggak bisa jawab yang itu. Coba bilang dengan cara lain.";hist.pop()}
    else{hist.push({role:"assistant",content:out});save();remoteSave(v,out)}
  }catch(e){
    if(e.userStop&&part.trim()){hist.push({role:"assistant",content:part});save();remoteSave(v,part)}
    else{u.remove();el.remove();hist.pop();ta.value=v;
      if(!e.userStop){const er=add("a","");er.className="m a err";er.textContent=errMsg(e);if(e.status===401||e.status===403)openKey()}}}
  AC=null;busy=false;fit();ta.focus();bottom()}
// riwayat disimpan ke akun hanya kalau sudah login
function remoteSave(a,b){if(!SES)return;sbx("confidant_messages","POST",[{role:"user",content:a},{role:"assistant",content:b}],"return=minimal").catch(()=>{})}
const EMPTY='<div id="empty"><b>Hai, Zaim.</b>Cerita apa aja, aku dengerin.</div>';
function paint(){log.innerHTML="";if(!hist.length)log.innerHTML=EMPTY;else hist.forEach(m=>add(m.role,m.content))}
async function loadRemote(){if(!SES)return;
  try{const r=await sbx("confidant_messages?select=role,content&order=id.desc&limit=60")||[];
    hist=r.reverse().filter(m=>m&&m.content);save();paint()}catch(e){}dataCtx()}
sb.onclick=send;
ta.addEventListener("input",fit);
ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&matchMedia("(hover:hover)").matches){e.preventDefault();if(!busy)send()}});
$("new").onclick=()=>{if(!hist.length||busy)return;if(!confirm("Mulai obrolan baru? Riwayat sekarang akan dihapus."))return;
  hist=[];save();paint();if(SES)sbx("confidant_messages?user_id=eq."+SES.user.id,"DELETE",undefined,"return=minimal").catch(()=>{})};
// ---------- API key ----------
function openKey(){$("kin").value="";$("kerr").textContent="";$("kdel").style.display=KEY?"":"none";$("kclose").style.display=KEY?"":"none";$("modal").classList.add("show");setTimeout(()=>$("kin").focus(),200)}
$("gear").onclick=openKey;$("kclose").onclick=()=>$("modal").classList.remove("show");
$("kdel").onclick=()=>{KEY="";MODEL="";try{localStorage.removeItem("zcf-key");localStorage.removeItem("zcf-model")}catch(e){}openKey()};
$("ksave").onclick=async()=>{const k=$("kin").value.trim();if(!k){$("kerr").textContent="Masukkan API key dulu.";return}
  const b=$("ksave");b.disabled=true;$("kerr").textContent="Memeriksa…";const old=KEY;KEY=k;MODEL="";
  try{await detectModel();try{localStorage.setItem("zcf-key",KEY)}catch(e){}$("modal").classList.remove("show")}
  catch(e){KEY=old;$("kerr").textContent=errMsg(e)}
  b.disabled=false};
$("kin").addEventListener("keydown",e=>{if(e.key==="Enter")$("ksave").click()});
$("ds").onclick=()=>dataCtx(true);
// ---------- login ----------
const GUEST=(()=>{try{return localStorage.getItem("zcf-guest")==="1"}catch(e){return false}})();
$("acc").textContent=SES?"Keluar":"Masuk";
function authErr(e){const m=(e.message||"")+" "+(e.code||"");
  if(/invalid login|invalid_credentials/i.test(m))return"Email atau password salah.";
  if(/already|exists/i.test(m))return"Email sudah terdaftar. Coba Masuk.";
  if(/not confirmed|email_not_confirmed/i.test(m))return"Email belum dikonfirmasi. Cek kotak masukmu.";
  if(/password/i.test(m))return"Password minimal 6 karakter.";
  if(/valid email|invalid.*email/i.test(m))return"Format email tidak valid.";
  if(/rate|too many|over_.*limit/i.test(m))return"Terlalu banyak percobaan. Tunggu sebentar.";
  if(e.name==="TypeError")return"Tidak bisa terhubung. Cek internetmu.";
  return"Gagal: "+(e.message||"coba lagi")}
async function doAuth(up){const em=$("aem").value.trim(),pw=$("apw").value,er=$("aerr");
  if(!em||pw.length<6){er.textContent="Isi email dan password (min. 6 karakter).";return}
  const bs=[$("ain"),$("aup")];bs.forEach(b=>b.disabled=true);er.textContent="Memproses…";
  try{const d=await authCall(up?"signup":"token?grant_type=password",{email:em,password:pw});
    if(setSes(d)){try{localStorage.removeItem("zcf-guest")}catch(e){}location.reload();return}
    er.textContent="Akun dibuat. Cek emailmu untuk konfirmasi, lalu tekan Masuk."}
  catch(e){er.textContent=authErr(e)}
  bs.forEach(b=>b.disabled=false)}
$("ain").onclick=()=>doAuth(false);$("aup").onclick=()=>doAuth(true);
$("apw").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doAuth(false)}});
$("aguest").onclick=()=>{try{localStorage.setItem("zcf-guest","1")}catch(e){}location.reload()};
$("acc").onclick=()=>{if(!SES){$("aerr").textContent="";$("auth").classList.add("show");return}
  if(!confirm("Keluar dari akun "+SES.user.email+"?"))return;
  try{fetch(SBU+"/auth/v1/logout",{method:"POST",headers:{apikey:SBK,Authorization:"Bearer "+SES.access_token}}).catch(()=>{})}catch(e){}
  SES=null;try{localStorage.removeItem("zcf-ses")}catch(e){}location.reload()};
// ---------- mulai ----------
if(!SES&&!GUEST)$("auth").classList.add("show");
else{if(hist.length)hist.forEach(m=>add(m.role,m.content));fit();if(!KEY)openKey();loadRemote()}
</script>
</body>
</html>
